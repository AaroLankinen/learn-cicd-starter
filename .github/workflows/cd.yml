on:
  push:
    branches: [main]
  
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build using buildprod.sh
        run: ./scripts/buildprod.sh